<title>Maskan — Aloqa</title>
<meta name="description" content="Maskan — xotira joylari uchun tozalik. Telegram bot, sayt va Instagram.">
<style>
  :root { --ink:#2E2A26; --gold:#B8963E; --gold-dark:#9c7d31; --bg:#F6F2E9; --muted:#6B6358; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:'Montserrat','Segoe UI',Arial,sans-serif;
    background:var(--bg); color:var(--ink);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card { width:100%; max-width:440px; text-align:center; }
  .logo-img { width:170px; height:auto; margin:0 auto 4px; display:block; }
  .tagline { color:var(--muted); font-size:15px; margin-bottom:8px; }
  .divider { width:64px; height:2px; background:var(--gold); margin:16px auto 26px; }

  a.btn {
    display:flex; align-items:center; text-align:left; gap:18px;
    text-decoration:none; color:var(--ink);
    background:#fff; border:1.5px solid var(--gold);
    padding:16px 20px; margin-bottom:16px; border-radius:20px;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  a.btn:active { transform:scale(.985); }
  a.btn.primary {
    background:linear-gradient(135deg, #C7A24A, #9c7d31);
    border-color:transparent; color:#fff;
    box-shadow:0 8px 20px rgba(156,125,49,.28);
  }
  .icon {
    flex:0 0 auto; width:62px; height:62px; border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(184,150,62,.12);
  }
  .primary .icon { background:rgba(255,255,255,.18); }
  .icon svg { width:30px; height:30px; }
  .txt .t { font-size:19px; font-weight:700; line-height:1.2; }
  .txt .s { font-size:13.5px; font-weight:400; margin-top:4px; }
  .btn:not(.primary) .txt .s { color:var(--muted); }
  .primary .txt .s { color:rgba(255,255,255,.85); }

  .footer { margin-top:24px; color:var(--muted); font-size:13.5px; }
  .footer b { color:var(--ink); }
</style>
